spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:intelliview_szmp}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}

  jpa:
    hibernate:
      ddl-auto: update  # 建议改为update，避免每次启动清空数据
      naming:
        physical-strategy: org.springframework.boot.orm.jpa.hibernate.SpringPhysicalNamingStrategy
        implicit-strategy: org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

  redis:
    host: localhost
    port: 6379
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
  elasticsearch:
    host: localhost
    port: 9200


github:
  client-id: ${GITHUB_CLIENT_ID:test-client-id}
  client-secret: ${GITHUB_CLIENT_SECRET:test-client-secret}
  redirect-uri: http://localhost:8080/api/auth/github/callback

# ============【修改】开发环境邮箱配置 ============
email:
  enabled: true
  # 这里的from应该与主配置文件一致，或者删除（因为主配置已生效）
  # 为了清晰，可以保持与主配置一致，但实际会使用主配置的值
  from: ${MAIL_FROM:${MAIL_USERNAME:}}  # 【请替换】与主配置保持一致
  mock: false  # 必须为false，进行真实发送
  # 以下配置已无用，可以删除
  # admin-emails: admin1@example.com,admin2@example.com

app:
  avatar:
    iflytek:
      enabled: true
      app-id: ${IFLYTEK_AVATAR_APP_ID:}
      api-key: ${IFLYTEK_AVATAR_API_KEY:}
      api-secret: ${IFLYTEK_AVATAR_API_SECRET:}
      scene-id: ${IFLYTEK_AVATAR_SCENE_ID:}
      avatar-id: ${IFLYTEK_AVATAR_RESOURCE_ID:}
      vcn: ${IFLYTEK_AVATAR_VCN:}
      player-app-id: ${IFLYTEK_AVATAR_PLAYER_APP_ID:1000000001}

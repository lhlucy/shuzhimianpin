spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:intelliview_szmp}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update  # 建议改为update，避免每次启动清空数据
      naming:
        physical-strategy: org.springframework.boot.orm.jpa.hibernate.SpringPhysicalNamingStrategy
        implicit-strategy: org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

  redis:
    host: localhost
    port: 6379
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
  elasticsearch:
    host: localhost
    port: 9200


github:
  client-id: ${GITHUB_CLIENT_ID:}
  client-secret: ${GITHUB_CLIENT_SECRET:}
  redirect-uri: ${GITHUB_REDIRECT_URI:http://localhost:8080/api/auth/github/callback}

# ============【修改】开发环境邮箱配置 ============
email:
  enabled: true
  from: ${MAIL_FROM:${MAIL_USERNAME:}}
  mock: ${MAIL_MOCK:false}

app:
  avatar:
    iflytek:
      enabled: true
      app-id: ${IFLYTEK_AVATAR_APP_ID:}
      api-key: ${IFLYTEK_AVATAR_API_KEY:}
      api-secret: ${IFLYTEK_AVATAR_API_SECRET:}
      scene-id: ${IFLYTEK_AVATAR_SCENE_ID:}
      avatar-id: ${IFLYTEK_AVATAR_RESOURCE_ID:}
      vcn: ${IFLYTEK_AVATAR_VCN:}
      player-app-id: ${IFLYTEK_AVATAR_PLAYER_APP_ID:1000000001}

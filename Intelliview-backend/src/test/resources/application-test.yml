spring:
  datasource:
    url: jdbc:h2:mem:intelliview_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  redis:
    host: localhost
    port: 6379
  elasticsearch:
    enabled: false

app:
  jwt:
    secret: test-jwt-secret-must-be-long-enough-for-hs512-signature-1234567890
    expiration: 86400000
    refresh-expiration: 604800000
  llm:
    aliyun:
      enabled: false
      app:
        enabled: false
      speech:
        enabled: false
  avatar:
    iflytek:
      enabled: false

server:
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173

email:
  enabled: false
  mock: true

logging:
  level:
    com.lingshu: WARN
    org.springframework.security: WARN
